# Runs the live-page check (scripts/canary.py) every day and on demand, with no cookies and no key.
# A failed run lists the problems in its job summary.
name: live-pages

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-pages
  cancel-in-progress: false

jobs:
  canary:
    name: mise run canary
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.4
          install_args: python
      - run: mise run canary
